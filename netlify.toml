# Belvency Privé — Netlify configuration
# Storefront = static export of the Next.js app (out/). Orders + admin API = Netlify Functions.

[build]
  command = "npm run build"
  publish = "out"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # Export the storefront as static files (see next.config.ts)
  STATIC_EXPORT = "1"
  # Build the shop from the REAL catalog in the admin store; the build stops if it is empty
  CATALOG_SOURCE = "live"
  # We deploy the static export ourselves; don't let Netlify auto-install its Next.js runtime plugin
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  NEXT_TELEMETRY_DISABLED = "1"

[functions]
  node_bundler = "esbuild"

# Baseline security headers for every response
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

# Fingerprinted build assets never change
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Local `netlify dev` serves the exported site plus the functions
[dev]
  command = ""
  publish = "out"
  functions = "netlify/functions"
  autoLaunch = false

# Belvency Privé — Netlify configuration
# Storefront = static export of the Next.js app (out/). Orders + admin API = Netlify Functions.

[build]
  command = "npm run build"
  publish = "out"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # Export the storefront as static files (see next.config.ts)
  STATIC_EXPORT = "1"
  # Build the shop from the REAL catalog in the admin store; the build stops if it is empty
  CATALOG_SOURCE = "live"
  # We deploy the static export ourselves; don't let Netlify auto-install its Next.js runtime plugin
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  NEXT_TELEMETRY_DISABLED = "1"

# ── Languages ─────────────────────────────────────────────────────────────
# The shop lives under /az, /en and /ru. "/" sends Russian-language browsers to /ru and everyone else to /az
# (visitors can switch language in the header). force = true because the exported site also has a "/" page.
[[redirects]]
  from = "/"
  to = "/ru"
  status = 302
  force = true
  conditions = { Language = ["ru"] }

[[redirects]]
  from = "/"
  to = "/az"
  status = 302
  force = true

# Addresses from before the language prefixes existed keep working (they open the Azerbaijani page).
[[redirects]]
  from = "/kataloq"
  to = "/az/kataloq"
  status = 301

[[redirects]]
  from = "/kataloq/*"
  to = "/az/kataloq/:splat"
  status = 301

